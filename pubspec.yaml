name: meeting_summary
description: RPAScribe records team meetings and shows an AI summary.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  record: ^5.1.2
  path_provider: ^2.1.3
  http: ^1.2.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#185FA5"
  adaptive_icon_foreground: "assets/icon_foreground.png"
